name: CI

on:
  pull_request:
  workflow_call:
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node: "true"
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - run: npx prettier --check .

      - run: ./gradlew spotlessCheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - run: ./gradlew build

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */build/reports/tests/test
            */build/test-results/test

  integration-test:
    name: integration-test (${{ matrix.podman-image }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        podman-image:
          - quay.io/podman/stable:v5.8.7
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - run: ./gradlew integrationTest
        env:
          PODMAN_IMAGE: ${{ matrix.podman-image }}

      - id: artifact
        if: always()
        run: echo "name=integration-test-reports-$(echo '${{ matrix.podman-image }}' | tr ':/' '--')" >> "$GITHUB_OUTPUT"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            podman-java-sdk-integration-test/build/reports/tests
            podman-java-sdk-integration-test/build/test-results

  integration-test-result:
    if: always()
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.integration-test.result }}" = success
