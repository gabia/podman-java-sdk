name: Setup build environment
description: Set up JDK, Gradle and optionally Node.js

inputs:
  node:
    description: Whether to install Node.js and npm dependencies
    default: "false"
  gradle-encryption-key:
    description: Key for encrypting the Gradle configuration cache; when empty, the configuration cache is not saved or restored
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}

    - if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: npm

    - if: inputs.node == 'true'
      shell: bash
      run: npm ci
