[versions]
java = "21"

junit = "6.1.3"

[libraries]
gradle-spotless = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version = "8.10.2" }

gradle-lombok = { module = "io.freefair.gradle:lombok-plugin", version = "9.5.0" }

gradle-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version = "0.37.0" }

jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.22.3" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version = "2.0.5" }

dotenv-java = { module = "io.github.cdimascio:dotenv-java", version = "3.2.0" }
