[versions]
java = "21"

junit = "6.1.3"

[libraries]
gradle-spotless = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version = "8.10.4" }

gradle-lombok = { module = "io.freefair.gradle:lombok-plugin", version = "9.8.2" }

gradle-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version = "0.37.0" }

jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }

jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version = "2.22" }

jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.22.3" }

jackson2-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version = "2.22.3" }

jackson3-databind = { module = "tools.jackson.core:jackson-databind", version = "3.2.3" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version = "4.1.1" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version = "2.0.5" }

dotenv-java = { module = "io.github.cdimascio:dotenv-java", version = "3.2.0" }
