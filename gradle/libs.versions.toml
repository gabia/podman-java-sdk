[versions]
java = "21"

junit = "6.1.3"

[libraries]
gradle-spotless = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version = "8.11.0" }

gradle-lombok = { module = "io.freefair.gradle:lombok-plugin", version = "9.8.3" }

gradle-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version = "0.37.0" }

jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }

# Shared by Jackson 2 and 3.
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version = "2.23" }

jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version = "2.23.0" }

jackson3-bom = { module = "tools.jackson:jackson-bom", version = "3.3.0" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version = "4.2.0" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version = "2.0.5" }

dotenv-java = { module = "io.github.cdimascio:dotenv-java", version = "3.2.0" }
